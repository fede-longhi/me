<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Wake Lock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding-top: 100px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .active { color: #28a745 !important; }
        .inactive { color: #dc3545 !important; }
    </style>
</head>
<body>

    <h2>Screen Sleep Preventer</h2>
    <p>This page uses your browser to stop your computer from going to sleep.</p>
    
    <button id="wakeButton">Keep Screen Awake</button>
    <div id="status" class="inactive">Status: Normal (Screen can sleep)</div>

    <script>
        let wakeLock = null;
        const button = document.getElementById('wakeButton');
        const statusText = document.getElementById('status');

        async function toggleWakeLock() {
            if (!wakeLock) {
                try {
                    // Request to keep the screen awake
                    wakeLock = await navigator.wakeLock.request('screen');
                    
                    statusText.textContent = "Status: Awake (Screen will not sleep)";
                    statusText.className = "active";
                    button.textContent = "Let Screen Sleep";
                    button.style.backgroundColor = "#28a745";

                    // If the system forces the lock to release (e.g. low battery)
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                        resetUI();
                    });

                } catch (err) {
                    statusText.textContent = `Error: ${err.name}, ${err.message}`;
                }
            } else {
                // Manually release the wake lock
                await wakeLock.release();
                wakeLock = null;
                resetUI();
            }
        }

        function resetUI() {
            statusText.textContent = "Status: Normal (Screen can sleep)";
            statusText.className = "inactive";
            button.textContent = "Keep Screen Awake";
            button.style.backgroundColor = "#007bff";
        }

        button.addEventListener('click', toggleWakeLock);
    </script>

</body>
</html>
